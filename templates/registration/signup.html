{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Sign Up{% endblock title %}

{% block content %}
<h2>新規登録</h2>
<a class="btn btn-outline-primary my-4" href="{% url 'social:begin' 'google-oauth2' %}" role="button">Googleで登録</a>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">送信</button>
</form>
{% endblock content %}

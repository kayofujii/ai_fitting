{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <title>{% block title %}AeyeFitting{% endblock title %}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
    <link rel="icon" href="{% static '/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static '/apple-touch-icon.png' %}">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@kayofujii1025" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />
    <meta property="og:title" content="AeyeFitting" />
    <meta property="og:description" content="お店に行かず、似合うかわかる。AI試着サービス" />
    <meta property="og:image" content="https://aeye-fitting.herokuapp.com{% static '/apple-touch-icon.png' %}" /> 
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9016715250972118"crossorigin="anonymous"></script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPNZKCGGBB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-CPNZKCGGBB');
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="{% url 'index' %}">AeyeFitting</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link dropdown-toggle" href="#"
                    id="navbarDropdown" role="button" data-toggle="dropdown"
                    aria-haspopup="true" aria-expanded="false">
                        メニュー
                    </a>
                    <div class="dropdown-menu dropdown-menu-lg-right"
                    aria-labelledby="navbarDropdown">
                        <a class="dropdown-item"
                        href="{% url 'about'%}">AeyeFittingとは
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item"
                        href="{% url 'index'%}">試着画像作成ページ
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="{% url 'help'%}">
                            お問い合わせ・プライバシーポリシー
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </nav> 
    <main>
        <div class="container">
            {% block content %}
            {% endblock content %}
        </div>
    </main>
    <footer class="bg-light py-3 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-1">
                </div>
                <div class="col-10 text-center">
                    <a class="small text-muted m-2" href="{% url 'help' %}">お問い合わせ・プライバシーポリシー</a>
                </div>
                <div class="col-1">
                </div>
            </div>
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10"><div class="small text-center text-muted">Copyright © 2022 - kayo fuji</div>
            </div>
            <div class="col-1">
            </div>
        </div>
    </div>
</footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
</body>
</html>

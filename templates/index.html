{% extends 'base.html' %}
{% block title %}Home{% endblock title %}

{% block content %}
        <div class='row mt-5'>
            <div class="col-md-6">
                <form method="post" action="{% url 'upload' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="inputGroupFileAddon01">アップロード</span>
                        </div>
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" name="user_im" id="inputGroupFile01" aria-describedby="inputGroupFileAddon01">
                            <label class="custom-file-label" for="inputGroupFile01">ユーザー画像を選択する</label>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="inputGroupFileAddon01">アップロード</span>
                        </div>
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" name="product_im" id="inputGroupFile01" aria-describedby="inputGroupFileAddon01">
                            <label class="custom-file-label" for="inputGroupFile01">商品画像を選択する</label>
                        </div>
                    </div>
                    <div class="text-center">
                        <button class="btn btn-primary btn-lg" type="submit">試着する</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="row my-4">
            <div class="col-md-6">
                {% for im in uploaded_images %}
                    <div class="card mb-4 index">
                        <img class="img-thumbnail" src="{{ im.image.url }}" />
                    </div>
                {% endfor %}
            </div>
        </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bs-custom-file-input/dist/bs-custom-file-input.js"></script>
    <script>
        bsCustomFileInput.init();
    </script>
{% endblock content %}
